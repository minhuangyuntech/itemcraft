{% extends "base.html" %}
{% block title %}管理者登入 - ItemCraft{% endblock %}
{% block content %}
<div class="auth-shell">
  <section class="content-panel auth-panel">
    <h1 class="h4 mb-2">管理者登入</h1>
    <p class="text-secondary">登入後即可進入命題工作台。</p>
    {% if form.errors %}
      <div class="alert alert-danger">帳號或密碼不正確，或此帳號沒有管理權限。</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">帳號</label>
        <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label for="{{ form.password.id_for_label }}" class="form-label">密碼</label>
        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100">登入</button>
    </form>
  </section>
</div>
{% endblock %}
